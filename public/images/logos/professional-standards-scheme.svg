<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-label="The Law Society of NSW Professional Standards Scheme">
  <defs>
    <style>
      .pss-slate { fill: #3E4E58; }
      .pss-orange { fill: #EF6C2D; }
      .pss-head {
        font-family: 'Arial Narrow', 'Helvetica Neue', 'Roboto Condensed', Arial, sans-serif;
        font-weight: 800;
      }
    </style>
  </defs>

  <!-- Orange bracket frame: top-right bar, right edge, bottom bar -->
  <rect class="pss-orange" x="300" y="6" width="300" height="15" />
  <rect class="pss-orange" x="585" y="6" width="15" height="194" />
  <rect class="pss-orange" x="0" y="185" width="600" height="15" />

  <!-- Eyebrow -->
  <text class="pss-head pss-slate" x="4" y="24" font-size="20"
        letter-spacing="2.5" textLength="280" lengthAdjust="spacingAndGlyphs">THE LAW SOCIETY OF NSW</text>

  <!-- Wordmark line 1 -->
  <text class="pss-head pss-slate" x="2" y="112" font-size="80"
        textLength="562" lengthAdjust="spacingAndGlyphs">PROFESSIONAL</text>

  <!-- Wordmark line 2 -->
  <text class="pss-head" x="2" y="176" font-size="80"
        textLength="562" lengthAdjust="spacingAndGlyphs"><tspan class="pss-slate">STANDARDS </tspan><tspan class="pss-orange">SCHEME</tspan></text>
</svg>
